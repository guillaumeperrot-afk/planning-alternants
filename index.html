<style>
:root{--bg:#f5f3ea;--card:#fff;--tx:#1b1f1c;--mut:#6a7068;--bd:#dedbcf;--ec:#1b4332;--en:#f4b8a6;--ok:#2d7a4f;--okbg:#dcefe3;--bad:#c2410c;--co:#e8735a}

*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{display:flex;gap:8px;align-items:center;padding:10px 20px;border-bottom:1px solid var(--bd);background:var(--card);flex-wrap:wrap;position:sticky;top:0;z-index:5}
h1{font-size:18px;margin:0;margin-right:12px;color:var(--ec)}h1 b{color:var(--co)}
main{padding:16px 20px;max-width:1400px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px}
input,select,button,textarea{font:inherit;padding:7px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}

.w.ec{background:var(--ec);color:#fff}
.leg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin:0 4px 0 12px;vertical-align:-1px}
.list{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:6px 12px;border:1px solid var(--bd);border-radius:999px;cursor:pointer;background:var(--card)}.chip.on{border-color:var(--ec);background:var(--ec);color:#fff}

th,td{border:1px solid var(--bd);padding:0}
th{font-weight:400;color:var(--mut);font-size:10px;padding:2px}th.mo{text-align:left;padding-left:3px;border-left:2px solid var(--mut)}
td.name{padding:4px 10px;white-space:nowrap;position:sticky;left:0;background:var(--card);min-width:200px;z-index:1}
td.c{width:24px;height:26px;min-width:24px}
.p{background:var(--ec)}.pn{background:var(--en)}
tr.pick td.name{background:var(--okbg)}tr.sum td.c{height:14px}.free{background:#cfe9d8}.one{background:#6bb58a}.two{background:var(--bad)}
.pair{display:inline-block;background:var(--okbg);border:1px solid var(--ok);border-radius:999px;padding:5px 14px;margin:3px}

.bar{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.st{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600;background:var(--bd);color:var(--tx)}
.st.nouveau{background:var(--co);color:#fff}.st.reponse_envoyee{background:#dbe7f3;color:#1d3b57}.st.match_propose{background:var(--okbg);color:var(--ok)}.st.en_rencontre{background:#efe3c8;color:#5d4510}.st.loge{background:var(--ec);color:#fff}.st.abandon{background:var(--bd);color:var(--mut)}
.late{color:var(--bad);font-weight:700}
.row{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:16px}

@media(max-width:700px){header{padding:8px 10px}main{padding:10px}.card{padding:12px}td.name{min-width:130px}h1{font-size:16px}button.tab{padding:6px 8px}}

<body>
<div id="app"></div>
<script>
const sb = supabase.createClient("https://eeezjlrplslqwnivrmhh.supabase.co",
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVlZXpqbHJwbHNscXduaXZybWhoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwODA2NzYsImV4cCI6MjEwNTY1NjY3Nn0.IdChjbQiWKqWAPXPVGBUEmKZoNa0VR05Ly9cO4O8f5A");
const $app = document.getElementById("app"), DAY = 864e5, HOUR = 36e5;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => (s||"").trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const iso = d => { const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4); return z.toISOString().slice(0,10) };
function mondayOf(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
const addW = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+7*n); return x };
const ST = {nouveau:"🆕 Nouveau",reponse_envoyee:"✉️ Réponse envoyée",match_propose:"🤝 Match proposé",en_rencontre:"☕ En rencontre",loge:"🏠 Logé",abandon:"⛔ Abandon"};
const STEP = {valide:"Match validé",propose:"Proposé aux deux",rencontre:"Rencontre",logement:"Logement trouvé",accord:"Accord du propriétaire",signe:"Signé",abandon:"Abandonné"};
const MOVE = {asap:"Dès que possible","1-3-mois":"Dans 1 à 3 mois",rentree:"À la rentrée",indecis:"Pas décidé"};
const TEAM = ["Guillaume","Etienne"];
const HS = {a:"🏠 A un logement", cherche:"🔍 Cherche un logement", indecis:"❔ Pas décidé", non:"⛔ Ne cherche pas"};

let KEY=null, who="", ccMail="", people=[], matches=[], activity=[], picked=[], openMatch=null, draft=null, city="", curCity="";
let showHelp=false, tab="inbox", flt={mine:"all",status:"",city:"",q:""}, yearStart = new Date().getMonth()>=7 ? new Date().getFullYear() : new Date().getFullYear()-1;

async function rpc(fn, args={}){
  const {data,error} = await sb.rpc(fn,{k:KEY,...args});
  if (error) { alert("Erreur : "+error.message); throw error; }
  return data;
}
async function load(){
  const d = await rpc("pa_load"); people = d.people; matches = d.matches; activity = d.activity||[]; who = d.who||""; ccMail = d.cc||"";
}
const reload = async()=>{ await load(); render(); };
const actor = () => who || "?";

function weeks(){ const out=[]; let d=mondayOf(new Date(yearStart,8,1)); const end=new Date(yearStart+1,8,1); while(d<end){out.push(d); d=addW(d,1)} return out; }
const yearLabel = () => `${yearStart}-${yearStart+1}`;
function cityAt(p, mon){ return norm((p.school_weeks||[]).includes(iso(mon)) ? p.school_city : p.company_city); }
function housIn(p, c){ const sc=norm(p.school_city)===c, cc=norm(p.company_city)===c; const s1=p.school_housing||"cherche", s2=p.company_housing||"cherche";
  if (sc&&cc) return s1==="non"?s2:s1; if (sc) return s1; if (cc) return s2; return "non"; }
const hsIcon = p => (HS[housIn(p,curCity)]||HS.cherche).split(" ")[0];
const hsBoth = p => (HS[p.school_housing]||HS.cherche).split(" ")[0]+"/"+(HS[p.company_housing]||HS.cherche).split(" ")[0];
const isIdeal = (a,b,c) => { const x=housIn(a,c), y=housIn(b,c); return (x==="a"&&y==="cherche")||(x==="cherche"&&y==="a"); };
const fullName = p => `${p.first_name}${p.last_name&&p.last_name!=="-"?" "+p.last_name:""}`;
const ageH = p => (Date.now()-new Date(p.created_at).getTime())/HOUR;
function ago(t){ const h=(Date.now()-new Date(t).getTime())/HOUR; return h<1?"à l'instant":h<24?`il y a ${Math.round(h)} h`:`il y a ${Math.round(h/24)} j`; }
const late = p => p.status==="nouveau" && ageH(p)>48;
const pending = () => people.filter(p=>p.status==="nouveau");

/* ---------- Correspondances : candidats pour une personne (même logique que le site) ---------- */
// On ne compare que les semaines à venir, et seulement jusqu'à la première date de fin d'alternance des deux personnes.
const endOf = p => p.end_date ? new Date(p.end_date+"T23:59") : null;
const fmtD = t => new Date(t).toLocaleDateString("fr-FR");
function span(a,b){ const m=mondayOf(new Date()), ea=endOf(a), eb=endOf(b); return weeks().filter(w=>w>=m&&(!ea||w<=ea)&&(!eb||w<=eb)); }
const MIN_OVERLAP = 6; // semaines minimum de période commune pour proposer un match
function candidatesFor(p){
  const ws=weeks(); const cities=new Map(); const ep=endOf(p); if(ep&&ep<new Date()) return [];
  [p.school_city,p.company_city].forEach(c=>{if(c&&c.trim())cities.set(norm(c),c.trim())});
  const out=[];
  for(const [c,label] of cities){
    if(housIn(p,c)==="non"||!ws.some(w=>cityAt(p,w)===c)) continue;
    const taken=new Set(matches.filter(m=>norm(m.city)===c).flatMap(m=>[m.person_a,m.person_b]));
    if(taken.has(p.id)) continue;
    for(const q of people){
      if(q.id===p.id||taken.has(q.id)||housIn(q,c)==="non"||["abandon","loge"].includes(q.status)) continue;
      const sp=span(p,q); if(sp.length<MIN_OVERLAP) continue;
      if(!sp.some(w=>cityAt(q,w)===c)||!sp.some(w=>cityAt(p,w)===c)) continue;
      const common=sp.filter(w=>cityAt(p,w)===c&&cityAt(q,w)===c).length;
      if(common>4) continue;
      const notes=[]; if(isIdeal(p,q,c)) notes.push("l'un a un logement, l'autre cherche");
      if(p.budget_max&&q.budget_max&&Math.abs(p.budget_max-q.budget_max)<=60) notes.push(`budgets proches (${p.budget_max} € / ${q.budget_max} €)`);
      if(p.move_in&&p.move_in===q.move_in) notes.push("même arrivée souhaitée");
      if(p.end_date||q.end_date) notes.push("période commune jusqu'au "+fmtD(Math.min(...[endOf(p),endOf(q)].filter(Boolean))));
      out.push({q,city:label,common,kind:common===0?"total":"partiel",ideal:isIdeal(p,q,c),notes});
    }
  }
  return out.sort((a,b)=>a.common-b.common||(b.ideal-a.ideal)||(b.notes.length-a.notes.length));
}

/* ---------- Messages prêts à envoyer ---------- */
const SIGN = "\n\nL'équipe Cohabite";
const DR = {
  ack:(p,c)=>({s:"Ta demande Cohabite est bien prise en compte",b:`Bonjour ${p.first_name},\n\nMerci pour ton inscription sur Cohabite. Ta demande est bien prise en compte : on regarde les alternants de ${c} dont le rythme est complémentaire du tien, et on te prévient dès qu'on a un match à te proposer.\n\nTu n'as rien d'autre à faire. Si ton rythme ou ton calendrier change, réponds simplement à ce message.`+SIGN}),
  total:(p,c)=>({s:"On a trouvé un match pour toi",b:`Bonjour ${p.first_name},\n\nBonne nouvelle : on a trouvé un alternant à ${c} dont les semaines à l'école et en entreprise s'alternent avec les tiennes.\n\nSi tu es toujours intéressé(e), réponds à ce message et on vous met en relation pour que vous vous rencontriez et voyiez si le courant passe.\n\nLe bail se signe directement avec le propriétaire, avec son accord. Cohabite met en relation, elle ne loue pas.`+SIGN}),
  partiel:(p,c)=>({s:"On a peut-être un match pour toi",b:`Bonjour ${p.first_name},\n\nOn a trouvé un alternant à ${c} dont le rythme est très proche du tien (quelques semaines se chevauchent, on peut en discuter).\n\nSi tu es toujours intéressé(e), réponds à ce message et on t'explique la suite.\n\nLe bail se signe directement avec le propriétaire, avec son accord. Cohabite met en relation, elle ne loue pas.`+SIGN}),
  cal:(p,c)=>({s:"Ta demande Cohabite : ton calendrier d'alternance",b:`Bonjour ${p.first_name},\n\nMerci pour ton inscription sur Cohabite. Pour te trouver un binôme, on a besoin de tes semaines à l'école et en entreprise.\n\nPeux-tu répondre à ce message avec une photo ou un PDF du planning de ton école ou CFA, ou simplement la liste des semaines où tu es en cours ? Ça nous suffit.\n\nDès qu'on l'a, on regarde les alternants de ${c} dont le rythme est complémentaire du tien.`+SIGN}),
  relance:(p,c)=>({s:"Ton inscription Cohabite est toujours active",b:`Bonjour ${p.first_name},\n\nOn revient vers toi : ton inscription à ${c} est toujours active. Ton rythme ou ton calendrier a-t-il changé ? Si oui, réponds simplement à ce message.`+SIGN}),
  refus:(p,c)=>({s:"Pas encore de match pour toi à "+c,b:`Bonjour ${p.first_name},\n\nPour le moment, nous n'avons pas d'alternant compatible avec ton rythme à ${c}. Ta demande reste enregistrée et on te prévient dès qu'un profil compatible s'inscrit.`+SIGN})
};
const needsCal = p => !(p.school_weeks||[]).length || /calendrier (estimé|non renseigné)/.test(p.notes||"");
const mailHref = (p,kind,c) => { const d=DR[kind](p,c); return `mailto:${encodeURIComponent(p.email||"")}?${ccMail?`cc=${encodeURIComponent(ccMail)}&`:""}subject=${encodeURIComponent(d.s)}&body=${encodeURIComponent(d.b)}`; };
const mailBtn = (p,kind,c,label,cls="sec") => p.email
  ? `<a class="btn ${cls}" href="${mailHref(p,kind,c)}" data-mail="${p.id}|${kind}" style="padding:4px 9px;font-size:13px">${label}</a>`
  : `<span class="mut" title="Pas d'email">${label} (pas d'email)</span>`;
function bindMail(){
  document.querySelectorAll("[data-mail]").forEach(a=>a.addEventListener("click",()=>{
    const [pid,kind]=a.dataset.mail.split("|"); const p=people.find(x=>x.id===pid); if(!p) return;
    setTimeout(async()=>{
      await rpc("pa_log",{pid,kind:"email_"+kind,detail:DR[kind](p,"").s,actor:actor()});
      if(kind==="ack"&&p.status==="nouveau") await rpc("pa_set_status",{pid,st:"reponse_envoyee",actor:actor(),detail:null});
      if((kind==="total"||kind==="partiel")&&["nouveau","reponse_envoyee"].includes(p.status)) await rpc("pa_set_status",{pid,st:"match_propose",actor:actor(),detail:null});
      await reload();
    },600);
  }));
}

/* ---------- En-tête et navigation ---------- */
function header(){
  const n=pending().length;
  document.title = (n?`(${n}) `:"")+"Planning alternants · Cohabite";
  const t=(k,l,b)=>`<button class="tab ${tab===k?"on":""}" data-tab="${k}">${l}${b?`<span class="badge">${b}</span>`:""}</button>`;
  return `<header><h1>Cohabite <b>planning</b></h1>
  ${t("inbox","À traiter",n)}${t("personnes","Inscrits")}${t("matchs","Matchs",matches.length)}${t("stats","Chiffres")}${t("calendrier","Calendrier")}
  <span style="flex:1"></span><span class="mut">${esc(who)||""}</span><button class="sec" id="help" title="Comment ça marche ?">?</button>
  ${["personnes","calendrier"].includes(tab)?`<button class="sec" id="py">◀</button><b>${yearLabel()}</b><button class="sec" id="ny">▶</button>`:""}
  </header>${showHelp?helpBox():""}`;
}
function helpBox(){ return `<main style="padding-bottom:0"><div class="card" style="border-color:var(--co)"><b>Comment ça marche</b><ol style="margin:8px 0 0;padding-left:20px;line-height:1.7"><li>Quelqu'un s'inscrit sur cohabite.fr : sa fiche arrive ici toute seule, dans <b>À traiter</b>.</li><li>Clique <b>✉️ Répondre</b> : le message est prêt, il ne reste qu'à l'envoyer.</li><li>Ouvre <b>match possible</b> : si deux alternants ne sont jamais dans la ville en même temps, clique <b>✓ Valider ce match</b>.</li><li>Suis ensuite le match dans l'onglet <b>Matchs</b>, jusqu'au logement. Les statuts se mettent à jour tout seuls.</li></ol><div class="bar" style="margin:10px 0 0"><button class="sec" id="helpclose">Compris</button></div></div></main>`; }
function bindHeader(){ const h=document.getElementById("help"); if(h) h.onclick=()=>{showHelp=!showHelp;render()}; const hc=document.getElementById("helpclose"); if(hc) hc.onclick=()=>{showHelp=false;render()};
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
  const py=document.getElementById("py"); if(py){py.onclick=()=>{yearStart--;render()}; document.getElementById("ny").onclick=()=>{yearStart++;render()}}
}
const render = () => ({inbox:renderInbox,personnes:renderPeople,calendrier:renderCal,matchs:renderMatches,stats:renderStats}[tab]||renderInbox)();

/* ---------- Filtres communs ---------- */
function visible(p){
  if(flt.mine==="mine"&&p.assigned_to!==who) return false;
  if(flt.mine==="none"&&p.assigned_to) return false;
  if(flt.status&&p.status!==flt.status) return false;
  if(flt.city&&![p.school_city,p.company_city].some(c=>norm(c)===flt.city)) return false;
  const q=norm(flt.q); if(q&&!norm([p.first_name,p.last_name,p.email,p.school,p.school_city,p.company_city].join(" ")).includes(q)) return false;
  return true;
}
function filterBar(){
  const cs=new Map(); people.forEach(p=>[p.school_city,p.company_city].forEach(c=>{if(c&&c.trim())cs.set(norm(c),c.trim())}));
  return `<details class="card" style="padding:10px 14px"${flt.q||flt.mine!=="all"||flt.status||flt.city?" open":""}><summary class="mut" style="cursor:pointer">🔎 Rechercher et filtrer</summary><div class="bar" style="margin-top:10px">
    <input id="f_q" placeholder="Rechercher (nom, email, école, ville)" value="${esc(flt.q)}" style="flex:1;min-width:180px">
    <select id="f_mine"><option value="all">Tous les dossiers</option><option value="mine" ${flt.mine==="mine"?"selected":""}>Mes dossiers</option><option value="none" ${flt.mine==="none"?"selected":""}>Non attribués</option></select>
    <select id="f_status"><option value="">Tous les statuts</option>${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${flt.status===k?"selected":""}>${v}</option>`).join("")}</select>
    <select id="f_city"><option value="">Toutes les villes</option>${[...cs.entries()].sort((a,b)=>a[1].localeCompare(b[1])).map(([k,l])=>`<option value="${k}" ${flt.city===k?"selected":""}>${esc(l)}</option>`).join("")}</select></div></details>`;
}
function bindFilters(){
  const q=document.getElementById("f_q"); if(!q) return;
  q.oninput=()=>{flt.q=q.value; clearTimeout(bindFilters.t); bindFilters.t=setTimeout(()=>{const pos=q.selectionStart; render(); const n=document.getElementById("f_q"); n.focus(); n.setSelectionRange(pos,pos)},250)};
  document.getElementById("f_mine").onchange=e=>{flt.mine=e.target.value;render()};
  document.getElementById("f_status").onchange=e=>{flt.status=e.target.value;render()};
  document.getElementById("f_city").onchange=e=>{flt.city=e.target.value;render()};
}

/* ---------- Journal ---------- */
const KIND = {inscription:"Inscription",statut:"Statut",assignation:"Attribué à",note:"Note",match:"Match",email_ack:"Réponse envoyée",email_total:"Match proposé (total)",email_partiel:"Match proposé (partiel)",email_relance:"Relance envoyée",email_refus:"Pas de match annoncé"};
const fmtDetail = d => { const [a,...r]=String(d).split(" · "); return ST[a]?ST[a]+(r.length?" · "+r.join(" · "):""):d; };
const journal = pid => activity.filter(a=>a.person_id===pid).slice(0,15).map(a=>`<div class="jr"><b>${esc(KIND[a.kind]||a.kind)}</b> ${a.detail?"· "+esc(fmtDetail(a.detail)):""} <small>· ${esc(a.actor)} · ${ago(a.created_at)}</small></div>`).join("")||'<span class="mut">Rien pour l\'instant.</span>';

/* ---------- Onglet À traiter ---------- */
function renderInbox(){
  const list=pending().filter(visible).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
  const waiting=people.filter(p=>p.status==="reponse_envoyee"&&visible(p));
  const card=p=>{
    const cs=candidatesFor(p).slice(0,3), c=p.school_city;
    const meta=[esc(p.school_city)+(p.company_city?" / "+esc(p.company_city):""),p.budget_max?p.budget_max+" €":"",p.end_date?"fin "+fmtD(p.end_date):"",p.assigned_to?"👤 "+esc(p.assigned_to):""].filter(Boolean).join(" · ");
    return `<div class="card"><div class="row"><div><b style="font-size:16px">${esc(fullName(p))}</b>${late(p)?' <span class="late">⏰ en retard</span>':""}${needsCal(p)?' <span class="late">📅 calendrier à demander</span>':""}<br><span class="mut">${meta} · inscrit ${ago(p.created_at)}</span></div>

      ${cs.length?`<details style="margin-top:10px"><summary style="cursor:pointer;color:var(--ok);font-weight:600">🤝 ${cs.length} match${cs.length>1?"s":""} possible${cs.length>1?"s":""}</summary>${cs.map(m=>`<div style="margin-top:8px"><span class="pair ${m.common?"part":""}">${m.ideal?"⭐ ":""}<b>${esc(fullName(m.q))}</b> à ${esc(m.city)} <small>· ${m.kind==="total"?"jamais là en même temps":"quelques semaines en commun"}${m.notes.length?" · "+esc(m.notes.join(" · ")):""}</small></span>
        <button class="sec" data-match="${p.id}|${m.q.id}|${esc(m.city)}">✓ Valider ce match</button> ${mailBtn(p,m.kind,m.city,"✉️ "+esc(p.first_name))} ${mailBtn(m.q,m.kind,m.city,"✉️ "+esc(m.q.first_name))}</div>`).join("")}</details>`:`<div class="mut" style="margin-top:8px">Pas encore de match. ${mailBtn(p,"refus",c,"✉️ Prévenir qu'on cherche encore")}</div>`}</div>`;
  };
  $app.innerHTML = header()+`<main>${filterBar()}
    <h2 style="margin:4px 0 12px;font-size:17px">À traiter <span class="badge" style="margin-left:6px">${list.length}</span></h2>
    ${list.map(card).join("")||'<div class="card mut">🎉 Tout est traité. La prochaine inscription apparaîtra ici toute seule.</div>'}
    ${waiting.length?`<details class="card"><summary style="cursor:pointer;font-weight:600">En attente d'un match (${waiting.length})</summary>${waiting.map(p=>{const cs=candidatesFor(p);return `<div class="row" style="margin-top:8px"><span>${esc(fullName(p))} <small>· ${esc(p.school_city)} · ${ago(p.replied_at||p.created_at)}</small> ${cs.length?`<span class="pair">${cs.length} candidat${cs.length>1?"s":""}</span>`:""}</span><span class="list">${mailBtn(p,"relance",p.school_city,"✉️ Relancer")}<button class="sec" data-edit="${p.id}">Fiche</button></span></div>`}).join("")}</details>`:""}
  </main>`;
  bindHeader(); bindFilters(); bindMail(); bindCommon();
}
function bindCommon(){

/* ---------- Onglet Personnes ---------- */
function tplFor(d, ws){
  if(!norm(d.school)||!norm(d.school_year)) return null;
  const set=new Set(ws.map(iso));
  const grp=people.filter(p=>p.id!==d.id&&norm(p.school)===norm(d.school)&&norm(p.school_year)===norm(d.school_year));
  const cnt={};
  grp.forEach(p=>{const k=(p.school_weeks||[]).filter(x=>set.has(x)).sort().join(","); if(k)cnt[k]=(cnt[k]||0)+1});
  const best=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
  return best?{weeks:best[0].split(","),n:grp.length}:null;
}
const hasWeeks=(d,ws)=>{const set=new Set(ws.map(iso));return d.school_weeks.some(k=>set.has(k))};
function applyTpl(d,ws,t){const set=new Set(ws.map(iso)); d.school_weeks=d.school_weeks.filter(k=>!set.has(k)).concat(t.weeks); d.prefilled=t.n;}

      <input id="g_d" type="date" value="${iso(ws[0])}">

  <div class="card mut">📎 Tu as déjà les calendriers en PDF, Excel ou photo ? Dépose-les dans le dossier <code>a-importer</code> de ce projet et dis-le moi : je les traduis en planning.</div>

  document.getElementById("new").onclick=()=>{draft={first_name:"",last_name:"",school:"",school_year:"",school_city:"",company_city:"",school_housing:"cherche",company_housing:"cherche",email:"",phone:"",notes:"",status:"nouveau",assigned_to:who,school_weeks:[]};render()};

/* ---------- Onglet Calendrier ---------- */
function renderCal(){
  const cityMap = {};
  people.forEach(p=>[p.school_city,p.company_city].forEach(c=>{if(c&&c.trim())cityMap[norm(c)] ||= c.trim()}));
  const cities = Object.entries(cityMap).sort((a,b)=>a[1].localeCompare(b[1]));
  if (!cities.some(([k])=>k===norm(city))) city = cities[0]?.[0] || "";
  const ws = weeks(), thisMon = iso(mondayOf(new Date()));
  curCity = city;
  const present = (p,w)=>cityAt(p,w)===city;
  const taken = new Set(matches.filter(m=>norm(m.city)===city).flatMap(m=>[m.person_a,m.person_b]));
  const members = people.filter(p=>!taken.has(p.id)&&housIn(p,city)!=="non"&&ws.some(w=>cityAt(p,w)===city));
  picked = picked.filter(id=>members.some(p=>p.id===id));
  const pk = picked.map(id=>members.find(p=>p.id===id));
  let pkInfo = "";
  if (pk.length===2){ let c=0; ws.forEach(w=>{ if(present(pk[0],w)&&present(pk[1],w)) c++ });
    pkInfo = c? `<span class="mut"> (${c} sem. en commun : match imparfait)</span>` : `<span class="mut"> (aucune semaine en commun)</span>`; }
  let head="<tr><th></th>",prev=-1;
  ws.forEach(w=>{const m=w.getMonth(); head+= m!==prev?`<th class="mo">${w.toLocaleDateString("fr-FR",{month:"short"})}</th>`:`<th>${w.getDate()}</th>`; prev=m}); head+="</tr>";
  const rows = members.map(p=>`<tr class="${picked.includes(p.id)?"pick":""}"><td class="name" data-pick="${p.id}" style="cursor:pointer" title="Clique pour sélectionner">${picked.includes(p.id)?"☑ ":"☐ "}<b>${hsIcon(p)} ${esc(fullName(p))}</b><br><small>${esc(p.school||"")} · ${esc(p.school_city)}${p.company_city?" / "+esc(p.company_city):""}</small></td>${
    ws.map(w=>{const here=present(p,w); const sch=(p.school_weeks||[]).includes(iso(w));
      return `<td class="c ${here?(sch?"p":"pn"):""}" title="${esc(p.first_name)} — ${w.toLocaleDateString("fr-FR")} : ${here?(sch?"école":"entreprise"):"ailleurs"}"></td>`}).join("")}</tr>`).join("");
  const sum = `<tr class="sum"><td class="name mut">Occupation (vert = libre / 1 pers., rouge = conflit)</td>${ws.map(w=>{
    const n=members.filter(p=>present(p,w)).length; return `<td class="c ${n===0?"free":n===1?"one":"two"}${iso(w)===thisMon?" today":""}" title="${n} pers."></td>`}).join("")}</tr>`;
  const pairs=[]; for(let i=0;i<members.length;i++)for(let j=i+1;j<members.length;j++){
    const a=members[i],b=members[j]; let common=0, covered=0;
    span(a,b).forEach(w=>{const pa=present(a,w),pb=present(b,w); if(pa&&pb)common++; if(pa||pb)covered++});
    pairs.push({a,b,common,covered})}
  pairs.sort((x,y)=>x.common-y.common||(isIdeal(y.a,y.b,city)-isIdeal(x.a,x.b,city))||y.covered-x.covered);
  const saved=new Set(matches.map(m=>[m.person_a,m.person_b].sort().join("|")+"|"+norm(m.city)));
  const key=p=>[p.a.id,p.b.id].sort().join("|")+"|"+city;
  const lbl=p=>`<span class="pair ${p.common?"part":""}">${isIdeal(p.a,p.b,city)?"⭐ ":""}${hsIcon(p.a)}${esc(fullName(p.a))} ⇄ ${hsIcon(p.b)}${esc(fullName(p.b))} <small>${isIdeal(p.a,p.b,city)?"un a un logement, l'autre cherche · ":(housIn(p.a,city)==="a"&&housIn(p.b,city)==="a")?"les deux ont un logement · ":""}${p.common?p.common+" sem. en commun":"aucune semaine en commun"} · ${p.covered}/${ws.length} sem. occupées</small> <button class="sec" data-match="${p.a.id}|${p.b.id}|${esc(cityMap[city])}" style="padding:2px 8px">✓ Valider</button></span>`;
  const fresh=pairs.filter(p=>!saved.has(key(p))); const perfect=fresh.filter(p=>!p.common), close=fresh.filter(p=>p.common>0&&p.common<=4);
  $app.innerHTML = header()+`<main>
  <div class="card"><div class="bar"><b>Ville :</b>
    <div class="list">${cities.map(([k,l])=>`<span class="chip ${k===city?"on":""}" data-city="${k}">${esc(l)}</span>`).join("")||'<span class="mut">Ajoute d\'abord des personnes.</span>'}</div></div></div>
  ${city?`<div class="card"><b>✅ Compatibles : jamais dans la ville en même temps</b><div style="margin-top:8px">${perfect.map(lbl).join("")||'<span class="mut">Aucune paire compatible pour l\'instant.</span>'}</div>
    ${close.length?`<div class="mut" style="margin-top:10px">Presque compatibles (4 semaines en commun ou moins) :</div>${close.map(lbl).join("")}`:""}</div>
  <div class="card" style="border-color:var(--ec)"><div class="bar"><b>🤝 Matcher à la main</b>
    <span class="mut">Coche deux personnes dans le calendrier (clique sur leur nom), même si le match est imparfait.</span></div>
    <div class="bar" style="margin:0">${pk.length?pk.map(p=>`<span class="pair">${esc(fullName(p))}</span>`).join(" + "):'<span class="mut">Aucune personne cochée.</span>'}${pkInfo}
    <button id="mm" ${pk.length===2?"":"disabled"} style="${pk.length===2?"":"opacity:.4"}">Valider ce match</button>
    ${pk.length?'<button class="sec" id="mc">Décocher</button>':""}</div></div>
  <div class="card"><div class="bar"><b>Calendrier ${yearLabel()}</b><span class="mut">Les personnes déjà matchées dans cette ville n'apparaissent plus ici.</span><span class="leg"><i style="background:var(--ec)"></i>En école ici<i style="background:var(--en)"></i>En entreprise ici</span></div>
    <div class="cal"><table>${head}${rows}${sum}</table></div></div>`:""}
  </main>`;
  bindHeader(); bindCommon();
  document.querySelectorAll("[data-city]").forEach(el=>el.onclick=()=>{city=el.dataset.city;render()});
  document.querySelectorAll("[data-pick]").forEach(el=>el.onclick=()=>{const id=el.dataset.pick;
    picked = picked.includes(id) ? picked.filter(x=>x!==id) : [...picked, id].slice(-2); render()});
  const mm=document.getElementById("mm"); if(mm) mm.onclick=async()=>{ if(picked.length!==2)return;
    await rpc("pa_save_match",{a:picked[0],b:picked[1],c:cityMap[city]}); picked=[]; await reload()};
  const mc=document.getElementById("mc"); if(mc) mc.onclick=()=>{picked=[];render()};
}

/* ---------- Onglet Matchs : suivi jusqu'au logement ---------- */
function renderMatches(){
  const byId=Object.fromEntries(people.map(p=>[p.id,p]));
  const ws=weeks();
  const commonOf=(a,b,c)=>{const cc=norm(c); return ws.filter(w=>cityAt(a,w)===cc&&cityAt(b,w)===cc).length};
  const card=p=>p?`<div class="card" style="margin:0"><b>${esc(fullName(p))}</b> <span class="st ${p.status}">${ST[p.status]}</span><br>
    <span class="mut">Logement école :</span> ${HS[p.school_housing]||HS.cherche}<br><span class="mut">Logement entreprise :</span> ${HS[p.company_housing]||HS.cherche}<br>
    <span class="mut">École :</span> ${esc(p.school||"—")} (${esc(p.school_city)})<br><span class="mut">Entreprise :</span> ${esc(p.company_city||"—")}<br>
    <span class="mut">Email :</span> ${p.email?`<a href="mailto:${esc(p.email)}">${esc(p.email)}</a>`:"—"}<br>
    <span class="mut">Tél :</span> ${p.phone?`<a href="tel:${esc(p.phone)}">${esc(p.phone)}</a>`:"—"}<br>
    ${p.budget_max?`<span class="mut">Budget :</span> ${p.budget_max} €<br>`:""}${p.notes?`<span class="mut">Notes :</span> ${esc(p.notes)}`:""}</div>`:"";
  $app.innerHTML=header()+`<main><div class="card"><b>Matchs validés (${matches.length})</b>
    <div style="margin-top:10px">${matches.map(m=>{const a=byId[m.person_a],b=byId[m.person_b]; if(!a||!b)return"";
      const kind=commonOf(a,b,m.city)===0?"total":"partiel";
      return `<div class="card" style="margin:8px 0;cursor:pointer" data-open="${m.id}"><div class="row"><span><b>${esc(fullName(a))} ⇄ ${esc(fullName(b))}</b>
      <span class="mut"> · ${esc(m.city)} · validé le ${new Date(m.created_at).toLocaleDateString("fr-FR")}</span></span>
      <select data-step="${m.id}">${Object.entries(STEP).map(([k,v])=>`<option value="${k}" ${m.step===k?"selected":""}>${v}</option>`).join("")}</select></div>
      ${openMatch===m.id?`<div class="grid" style="margin-top:10px">${card(a)}${card(b)}</div>
        <div class="bar" style="margin-top:10px">${mailBtn(a,kind,m.city,"✉️ Message à "+esc(a.first_name))} ${mailBtn(b,kind,m.city,"✉️ Message à "+esc(b.first_name))}</div>
        <div class="bar"><input id="mn" placeholder="Notes sur ce match" value="${esc(m.notes)}" style="flex:1"><button id="mns">Enregistrer la note</button><button class="del" id="mdel">Supprimer le match</button></div>`:""}</div>`}).join("")||'<span class="mut">Aucun match validé. Dans « À traiter » ou « Calendrier », clique sur « ✓ Valider ».</span>'}</div></div></main>`;
  bindHeader(); bindMail();
  document.querySelectorAll("[data-open]").forEach(el=>el.onclick=e=>{ if(e.target.closest("input,button,a,select"))return; openMatch=openMatch===el.dataset.open?null:el.dataset.open; render()});
  document.querySelectorAll("[data-step]").forEach(s=>s.onchange=async()=>{await rpc("pa_match_step",{mid:s.dataset.step,st:s.value,actor:actor()});
    const m=matches.find(x=>x.id===s.dataset.step);
    if(m&&["rencontre"].includes(s.value)) for(const pid of [m.person_a,m.person_b]) await rpc("pa_set_status",{pid,st:"en_rencontre",actor:actor(),detail:null});
    if(m&&["logement","accord","signe"].includes(s.value)&&s.value==="signe") for(const pid of [m.person_a,m.person_b]) await rpc("pa_set_status",{pid,st:"loge",actor:actor(),detail:null});
    await reload()});
  const n=document.getElementById("mns"); if(n) n.onclick=async()=>{await rpc("pa_note_match",{mid:openMatch,n:document.getElementById("mn").value});await reload()};
  const d=document.getElementById("mdel"); if(d) d.onclick=async()=>{if(!confirm("Supprimer ce match ?"))return;await rpc("pa_delete_match",{mid:openMatch});openMatch=null;await reload()};
}

/* ---------- Tableau de bord ---------- */
function bars(entries){ const max=Math.max(1,...entries.map(e=>e[1])); return `<div class="bars">${entries.map(([l,n])=>`<div><span style="width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(l)}</span><i style="width:${Math.max(2,n/max*180)}px"></i><b>${n}</b></div>`).join("")||'<span class="mut">—</span>'}</div>`; }
function count(arr,f){ const m={}; arr.forEach(x=>{const k=f(x)||"—"; m[k]=(m[k]||0)+1}); return Object.entries(m).sort((a,b)=>b[1]-a[1]); }
function renderStats(){
  const rep=people.filter(p=>p.replied_at); const avgH=rep.length?rep.reduce((s,p)=>s+(new Date(p.replied_at)-new Date(p.created_at))/HOUR,0)/rep.length:null;
  const wk=[]; const m0=mondayOf(new Date()); for(let i=7;i>=0;i--){const a=addW(m0,-i), b=addW(a,1); wk.push([a.toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit"}),people.filter(p=>{const t=new Date(p.created_at);return t>=a&&t<b}).length])}
  const old=people.filter(p=>["loge","abandon"].includes(p.status)&&Date.now()-new Date(p.created_at)>24*30*DAY).length;
  $app.innerHTML=header()+`<main>
   <div class="kpis"><div class="kpi">Inscrits<b>${people.length}</b></div><div class="kpi">À traiter<b>${pending().length}</b></div>
    <div class="kpi">Sans réponse &gt; 48 h<b style="color:var(--bad)">${people.filter(late).length}</b></div>
    <div class="kpi">Délai moyen de réponse<b>${avgH==null?"—":avgH<48?Math.round(avgH)+" h":Math.round(avgH/24)+" j"}</b></div>
    <div class="kpi">Matchs validés<b>${matches.length}</b></div><div class="kpi">Logés<b>${people.filter(p=>p.status==="loge").length}</b></div></div>
   <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))">
    <div class="card"><b>Inscrits par semaine (8 dernières)</b>${bars(wk)}</div>
    <div class="card"><b>Par statut</b>${bars(count(people,p=>ST[p.status]))}</div>
    <div class="card"><b>Par ville d'école</b>${bars(count(people,p=>p.school_city).slice(0,10))}</div>
    <div class="card"><b>Par source</b>${bars(count(people,p=>p.source))}</div>
    <div class="card"><b>Matchs par étape</b>${bars(count(matches,m=>STEP[m.step]))}</div>
    <div class="card"><b>Fins d'alternance dans les 60 jours</b><div style="margin-top:8px">${people.filter(p=>p.end_date&&!["loge","abandon"].includes(p.status)&&endOf(p)>new Date()&&endOf(p)-Date.now()<60*DAY).sort((a,b)=>endOf(a)-endOf(b)).map(p=>`${esc(fullName(p))} <small>· ${fmtD(p.end_date)}</small>`).join("<br>")||'<span class="mut">—</span>'}</div></div>
    <div class="card"><b>Charge par responsable</b>${bars(count(people.filter(p=>!["loge","abandon"].includes(p.status)),p=>p.assigned_to||"Non attribué"))}</div></div>
   <div class="card"><b>Sauvegarde et RGPD</b><div class="bar" style="margin-top:8px"><button id="csv">⬇️ Exporter les inscrits (CSV)</button>
    <button class="sec" id="purge" ${old?"":"disabled"}>🧹 Supprimer les dossiers terminés de plus de 24 mois (${old})</button></div>
    <small>Les dossiers « logé » ou « abandon » créés il y a plus de 24 mois peuvent être supprimés. L'export est à faire chaque semaine (une copie par email part aussi automatiquement le lundi).</small></div></main>`;
  bindHeader();
  document.getElementById("csv").onclick=()=>{
    const cols=["first_name","last_name","email","phone","school","school_city","company_city","school_housing","company_housing","status","assigned_to","budget_max","move_in","source","created_at","replied_at","notes"];
    const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
    const csv="﻿"+cols.join(",")+"\n"+people.map(p=>cols.map(c=>q(p[c])).join(",")).join("\n");
    const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"})); a.download="cohabite-planning-"+iso(new Date())+".csv"; a.click();
  };
  const pg=document.getElementById("purge"); if(pg) pg.onclick=async()=>{ if(!confirm("Supprimer définitivement ces dossiers ?"))return; const n=await rpc("pa_purge",{months:24}); alert(n+" dossier(s) supprimé(s)."); await reload()};
}

async function init(){
  const m = location.hash.match(/k=([a-f0-9]+)/);
  try { if (m) localStorage.setItem("pa_key", m[1]); KEY = m ? m[1] : localStorage.getItem("pa_key"); } catch { KEY = m && m[1]; }
  if (!KEY) { $app.innerHTML = '<div class="card login"><h1>Planning alternants</h1><p class="mut">Lien incomplet : ouvre le lien complet qui finit par <code>#k=…</code>.</p></div>'; return; }
  try { await load(); } catch { $app.innerHTML = '<div class="card login"><h1>Lien invalide</h1><p class="mut">Ce lien n\'est pas le bon.</p></div>'; return; }
  if(!pending().length) tab="personnes";
  render();
  window.addEventListener("focus", async()=>{ if(!draft){ await load(); render(); } });
}
init();
</script>
</body>
